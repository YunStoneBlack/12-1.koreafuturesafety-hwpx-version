# groupware.kfsc21c.com의 443 server 블록 안(기존 `location / { ... }` 위)에 넣는 규칙.
# /report/... 요청을 이 서버의 127.0.0.1:18000(= 보고서 PC가 SSH 역방향 통로로 연 포트)으로 경로 그대로 넘긴다.
# 넘기기 전에 그룹웨어 로그인 여부를 확인(auth_request)하고, 로그인한 사용자 정보 + 비밀값을 헤더로 붙인다
# (보고서 서버는 이 헤더로 사용자를 알아본다 — 보고서 자체 로그인 없음). 보고서 PC가 꺼져 있으면 안내 화면(502).
# __RELAY_SECRET__ 은 적용할 때 보고서 PC의 server/.env.server 의 GROUPWARE_RELAY_SECRET 값으로 바꿔 넣는다(저장소엔 안 올림).

    # 그룹웨어의 내부 전용 주소(로그인 확인)는 외부에서 직접 못 부르게
    location /internal/ {
        return 404;
    }

    location = /_gw_report_auth {
        # auth 하위요청도 원래 요청의 크기를 이 location 기준으로 검사한다(본문은 안 넘기는데도) — 안 적으면 기본 1MB라
        # 1MB 넘는 사진 업로드가 여기서 413 → auth_request가 500으로 바꿔 실패했음(2026-09-29 발견·수정).
        client_max_body_size 300m;
        internal;
        proxy_pass http://127.0.0.1:8082/internal/report-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그룹웨어에 로그인 안 된 상태: 화면은 그룹웨어 로그인으로, 화면 속 API 요청은 401(화면이 알아서 처리)
    location @report_login {
        if ($request_uri ~ "^/report/api/") {
            return 401;
        }
        return 302 /login;
    }

    location = /report {
        return 301 /report/;
    }

    location /report/ {
        auth_request /_gw_report_auth;
        auth_request_set $gw_user $upstream_http_x_gw_user;
        auth_request_set $gw_name $upstream_http_x_gw_name;
        auth_request_set $gw_role $upstream_http_x_gw_role;
        error_page 401 = @report_login;

        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 접속자가 흉내 낸 같은 이름의 헤더는 아래 값으로 덮어써진다(비어 있으면 아예 안 보냄)
        proxy_set_header X-Gw-User $gw_user;
        proxy_set_header X-Gw-Name $gw_name;
        proxy_set_header X-Gw-Role $gw_role;
        proxy_set_header X-Relay-Secret "__RELAY_SECRET__";

        client_max_body_size 300m;    # 폰 원본 사진·계약서 PDF·보고서 합본 업로드(10/8 30m→300m — 40회차 합본 199MB)
        proxy_connect_timeout 5s;     # 통로가 없으면 빨리 안내 화면으로
        proxy_read_timeout 180s;      # AI 분석·한글 파일 생성(수십 초)
        proxy_send_timeout 180s;

        proxy_intercept_errors on;
        # "=" 없이: 상태 코드는 502 그대로 두고 안내 화면만 보여준다(화면의 API 호출이 실패를 실패로 인식하도록)
        error_page 502 503 504 /report_offline.html;
    }

    location = /report_offline.html {
        internal;
        root /usr/share/nginx/kfsc-report;
    }
