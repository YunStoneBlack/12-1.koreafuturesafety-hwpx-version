<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>보고서 자동화 - 잠시 연결할 수 없음</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
         background: #F4F6FB; color: #1B1E2E; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .card { background: #fff; border: 1px solid #E3E6F0; border-radius: 12px; padding: 32px 28px; max-width: 420px; text-align: center;
          box-shadow: 0 1px 8px rgba(27,30,46,.05); }
  h1 { font-size: 18px; margin: 0 0 10px; }
  p { color: #6B7089; font-size: 14px; line-height: 1.6; margin: 0 0 18px; }
  a { display: inline-block; padding: 9px 18px; border-radius: 8px; background: #2A7DE1; color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>보고서 자동화에 잠시 연결할 수 없습니다</h1>
    <p>보고서 서버가 재시작 중이거나 꺼져 있습니다.<br />보통 1~2분 안에 복구됩니다. 잠시 후 다시 시도해 주세요.<br />작성하던 내용은 서버에 저장돼 있습니다.</p>
    <a href="/report/">다시 시도</a>
  </div>
</body>
</html>
