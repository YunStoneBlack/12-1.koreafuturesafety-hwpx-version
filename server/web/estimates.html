<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>견적 - 서류 자동화</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="css/sitok.css" />
<link rel="stylesheet" href="css/estimate.css" />
</head>
<!-- 통합 견적(2026-10-29 사용자 "그룹웨어 통합 견적서 — 각 용역별로 선택해서 쓰고 관리"): 서류 자동화 왼쪽 메뉴 맨 앞.
     [＋ 새 견적] 용역 8가지 → 견적 화면(estimate.html) / 목록(상태·용역·검색) / ⚙ 기준표(노임단가 연도별·기술지도 회당 인건비 구간·율). 서버 server/api/routers/estimates.py -->
<body data-docs-tab="estimate">
<div class="app">
  <aside class="sidebar" id="gw-sidebar"></aside>
  <main class="main">

<div id="error" class="error"></div>
<div id="es-notice"></div>

<section class="panel">
  <div class="panel-head"><h2>＋ 새 견적</h2><span class="panel-count">용역을 고르면 회사 견적서와 같은 칸·계산으로 시작합니다 — 같은 발주처 견적은 목록에서 [복사]</span></div>
  <div class="panel-body"><div class="es-kinds" id="es-kinds"></div></div>
</section>

<section class="panel">
  <div class="panel-head"><h2>견적 목록</h2><span class="panel-count" id="es-count"></span></div>
  <div class="panel-body">
    <div class="es-filter">
      <div class="es-chips" id="es-status"></div>
      <select id="es-kind"><option value="">용역 전체</option></select>
      <input id="es-q" placeholder="번호·발주처·공사명·담당 찾기" />
    </div>
    <div id="es-list"><div class="empty-note">불러오는 중…</div></div>
  </div>
</section>

<details class="panel sk-fold" id="es-rates-panel">
  <summary class="panel-head"><h2>⚙ 기준표</h2><span class="panel-count">엔지니어링 노임단가(연도별)·기술지도 회당 인건비·제경비·기술료율 — 매년 노임단가 공표 때 여기만 바꾸면 됩니다</span><span class="sk-fold-arrow">▾</span></summary>
  <div class="panel-body" id="es-rates"></div>
</details>

  </main>
</div>
<script src="app.js"></script>
<script src="shell.js"></script>
<script src="js/estimates.js"></script>
</body>
</html>
