<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>구조 일람표 부재 목록 - 시특법</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="css/mail.css" />
<link rel="stylesheet" href="css/sitok.css" />
<link rel="stylesheet" href="css/sitok-schedule.css" />
</head>
<!-- 구조 일람표 부재 목록(2026-10-21 사용자·민재형 — 내진성능평가 철근탐사 1단계). 시설물 도면 "구조 일람표"를 AI가 쪽마다 읽어 기둥·보·벽체 칸 목록으로 저장,
     기둥 변별(단변·장변) 점 개수·두 줄 하부근은 단면 그림을 보며 한 번 [✓ 확인](AI 점 세기는 못 믿음 — 10/21 시험). 철근탐사 화면이 이 목록으로 설계값을 채움.
     서버 server/api/routers/sitok_rebar.py(계산 server/sitok/rebar_schedule.py), 화면 js/sitok-schedule.js. ?facility=시설물 id -->
<body data-report-tab="facilities" data-law="sitok" data-tabs-only>
<div class="app">
  <aside class="sidebar" id="gw-sidebar"></aside>
  <main class="main">

<div class="crumb"><a href="sitok.html">시설물 목록</a> › <a id="rs-fac-link" href="#">시설물</a> › <span>구조 일람표 부재 목록</span></div>
<div id="error" class="error"></div>

<section class="panel">
  <div class="panel-head"><h2>📏 구조 일람표 부재 목록</h2><span class="panel-count" id="rs-count"></span></div>
  <div class="panel-body">
    <p class="page-sub">시설물 도면 칸에 올린 구조 일람표를 AI가 쪽마다 읽어 기둥·보·벽체 칸(부호 × 층 × 위치)으로 정리합니다. 치수·주근·대근·늑근·벽근 글자는 그대로 쓰고,
      <b>기둥 단변·장변 점 개수</b>와 <b>두 줄 하부근</b>은 단면 그림을 보고 한 번 확인해 주세요(검산: 2 × (단변 + 장변) − 4 = 주근 총수). 철근탐사에서 층·부호만 고르면 이 값이 설계값으로 들어갑니다.</p>
    <div class="rs-files" id="rs-files"></div>
    <div class="rs-bar">
      <button type="button" id="rs-read">🤖 일람표 읽기</button>
      <span class="sk-help" id="rs-status"></span>
    </div>
    <div class="rs-filter" id="rs-filter"></div>
  </div>
</section>

<div id="rs-lists"></div>

<section class="panel">
  <div class="panel-head"><h2>＋ 칸 직접 추가</h2><span class="panel-count">도면에 없거나 AI가 못 읽은 칸</span></div>
  <div class="panel-body">
    <div class="field-grid rs-add" id="rs-add"></div>
    <div class="mail-msg" id="rs-add-msg" hidden></div>
    <div class="rs-add-foot"><button type="button" class="secondary" id="rs-add-btn">추가</button></div>
  </div>
</section>

  </main>
</div>

<script src="app.js"></script>
<script src="shell.js"></script>
<script src="js/sitok-schedule.js"></script>
</body>
</html>
