<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시설물 - 시특법</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="css/mail.css" />
<link rel="stylesheet" href="css/sitok.css" />
</head>
<!-- 시특법 시설물 화면(2026-10-10 2단계, 10/14 형 피드백 ⑦ 3층 구조) — ?id= 없으면 새 등록(sitok-new.html).
     위 = "① 시설물 등록·정보"(10/16 개편 — 등록 전이면 펼침: 보고서 하나·따로·동 묶음 × 관리대장/결과표, 건축물대장·도면·같이 점검하는 동·시설물 칸)
     / 점검 회차 목록(누르면 회차 화면 sitok-round.html) / 접힌 "계약"(회차별로 쌓임).
     칸 정의·저장은 js/sitok-facility.js, 회차 목록 js/sitok-reports.js, 도면 js/sitok-drawings.js, 서버 server/api/routers/sitok.py. -->
<body data-report-tab="facilities" data-law="sitok" data-tabs-only>
<div class="app">
  <aside class="sidebar" id="gw-sidebar"></aside>
  <main class="main">

<div class="crumb"><a href="sitok.html">시설물 목록</a> › <span id="sk-crumb">시설물</span></div>
<div id="error" class="error"></div>

<details class="panel sk-fold" id="sk-info-panel">
  <summary class="panel-head"><h2>🏢 ① 시설물 등록·정보</h2><span class="panel-count" id="sk-info-count">보고서를 어떻게 내는지·관리대장(없으면 결과표)·건축물대장·도면·시설물 칸 — 모든 회차가 같이 씀</span><span class="sk-fold-arrow">▾</span></summary>
  <div class="panel-body">
    <div class="sk-dong-pick" id="sk-dong-pick" hidden></div>
    <!-- 10/16 민재형 개편: 시설물(건물·동) 등록은 여기서만 — 보고서 하나·따로(N-1·N-2)·동 묶음 × 관리대장 / 관리대장 없음(결과표). js/sitok-register.js -->
    <h3 class="sk-h3">시설물 등록</h3>
    <div class="rg" id="sk-reg"></div>
    <h3 class="sk-h3">건축물대장</h3>
    <div class="sk-drops sk-drops-one" id="sk-pdfs">
      <label class="sk-drop" id="sk-register"><input type="file" accept="application/pdf,.pdf" hidden data-kr-file="1" />
        <b>📄 건축물대장 PDF</b><span class="sk-drop-msg" id="sk-register-msg">시설물 현황 [🤖 채우기]·면담 1.2.8 초안이 읽습니다(층별 용도·면적·변동사항)</span></label>
    </div>
    <h3 class="sk-h3">도면</h3>
    <div id="sk-dwg"></div>
    <h3 class="sk-h3">시설물 칸</h3>
    <form id="sk-form" autocomplete="off">
      <div id="sk-fac"></div>
      <div class="sk-actions">
        <button type="button" class="danger" id="sk-del" hidden>시설물 삭제</button>
        <span class="sk-saved" id="sk-saved"></span>
        <button type="submit" id="sk-save">저장</button>
      </div>
    </form>
  </div>
</details>


<!-- 10/16 민재형: 건물을 보고서 상자에 끌어다 넣어 몇 권 낼지(같은 상자 = 동 묶음), 계약이 여럿이면 상자마다 계약 — js/sitok-compose.js -->
<section class="panel" id="sk-compose-panel" hidden>
  <div class="panel-head"><h2>📚 보고서 구성</h2><span class="panel-count">건물을 보고서 상자에 넣어 몇 권 낼지 정합니다 — 같은 상자 = 동 묶음(보고서 한 권), 언제든 바꿀 수 있음</span></div>
  <div class="panel-body" id="sk-compose"></div>
</section>

<section class="panel" id="sk-rep-panel" hidden>
  <div class="panel-head"><h2>점검 회차</h2><span class="panel-count">회차를 누르면 현장 조사·재료시험·보고서 만들기 화면으로 갑니다</span></div>
  <div class="panel-body" id="sk-reps"></div>
</section>

<details class="panel sk-fold" id="sk-con-panel">
  <summary class="panel-head"><h2>📑 계약</h2><span class="panel-count" id="sk-con-count">회차별로 쌓입니다 — 최근 계약이 위</span><span class="sk-fold-arrow">▾</span></summary>
  <div class="panel-body">
    <div class="sk-con-top"><button type="button" class="secondary btn-sm" id="sk-add-con" hidden>+ 계약 추가</button>
      <span class="sk-help">새 회차를 만들 때 계약서를 올려도 여기에 쌓입니다</span></div>
    <div id="sk-cons"></div>
  </div>
</details>

  </main>
</div>

<script src="app.js"></script>
<script src="shell.js"></script>
<script src="mail.js"></script>
<script src="js/docs-common.js"></script>
<script src="js/sitok-fields.js"></script>
<script src="js/sitok-drawings.js"></script>
<script src="js/sitok-facility.js"></script>
<script src="js/sitok-reports.js"></script>
<script src="js/sitok-compose.js"></script>
<script src="js/sitok-register.js"></script>
</body>
</html>
