<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>내진성능평가 - 보고서 자동화</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="css/mail.css" />
<link rel="stylesheet" href="css/sitok.css" />
</head>
<!-- 내진성능평가(2026-10-21 사용자 — 시특법과 완전히 별개 용역): 왼쪽 메뉴 보고서 자동화 아래 시특법 다음 줄.
     [＋ 새 내진성능평가] = 용역계약서·건축물대장 PDF를 읽어 건 만들기(시특법 시설물 고르기 없음) → 건 화면(seismic-project.html).
     서버 server/api/routers/seismic.py(GET·POST /seismic/projects), 화면 js/seismic.js -->
<body data-report-tab="seismic" data-law="sitok">
<div class="app">
  <aside class="sidebar" id="gw-sidebar"></aside>
  <main class="main">

<div id="error" class="error"></div>

<section class="panel">
  <div class="panel-head"><h2>＋ 새 내진성능평가</h2><span class="panel-count">용역계약서·건축물대장 PDF를 올리면 용역·건물 정보를 읽어 건을 만듭니다 — 못 읽은 칸은 건 화면에서 직접</span></div>
  <div class="panel-body">
    <div class="sk-drops">
      <label class="sk-drop" id="sv-c-drop"><b>📄 용역계약서 PDF</b><span class="sk-drop-msg" id="sv-c-msg">나라장터 계약서 — 용역명·발주처·금액·착수·완수</span>
        <input type="file" accept=".pdf,application/pdf" hidden data-kr-file="1" id="sv-c" /></label>
      <label class="sk-drop" id="sv-r-drop"><b>🏢 건축물대장 PDF</b><span class="sk-drop-msg" id="sv-r-msg">정부24 발급본 — 건물명·주소·구조·층수·면적·사용승인일</span>
        <input type="file" accept=".pdf,application/pdf" hidden data-kr-file="1" id="sv-r" /></label>
    </div>
    <div class="field-grid ds-form">
      <div class="sk-f ds-wide"><label for="sv-name">건물 이름 <span class="sk-help">비우면 건축물대장 명칭(없으면 계약건명에서)</span></label>
        <input id="sv-name" placeholder="예: 삼숭초 교사동" maxlength="60" /></div>
    </div>
    <div class="mail-msg" id="sv-msg" hidden></div>
    <div class="ds-foot"><button type="button" id="sv-create">읽어서 만들기</button></div>
  </div>
</section>

<section class="panel">
  <div class="panel-head"><h2>내진성능평가 목록</h2><span class="panel-count" id="sv-count"></span></div>
  <div class="panel-body" id="sv-list"></div>
</section>

  </main>
</div>

<script src="app.js"></script>
<script src="shell.js"></script>
<script src="js/seismic.js"></script>
</body>
</html>
