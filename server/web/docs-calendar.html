<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>착수·완수 일정 - 서류 자동화</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="css/mail.css" />
<link rel="stylesheet" href="css/contract-docs.css" />
<link rel="stylesheet" href="css/docs.css" />
<!-- 달력은 방문 달력과 같은 FullCalendar(그룹웨어 달력과 같은 판) — 공휴일·주말 모양은 그룹웨어 app.css .fc 규칙 -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<!-- 서류 자동화 — 착수·완수 일정 달력(2026-10-06, js/docs-calendar.js). 계약의 착수일·완수일에 표시(기한 아님) -->
<body data-docs-tab="calendar">
<div class="app">
  <aside class="sidebar" id="gw-sidebar"></aside>
  <main class="main">

<div id="error" class="error"></div>

<p class="page-sub dc-note">계약의 착수일·완수일을 보여 줍니다(정해진 제출 기한은 없음). ✓는 그 서류를 이미 제출했다는 뜻이고, 누르면 그 서류 창이 열립니다.</p>
<section class="panel">
  <div class="panel-body">
    <div id="dk-cal"></div>
    <div class="dk-legend"><span><i class="start"></i>착수일(착수계)</span><span><i class="done"></i>완수일(완수계)</span><span><i class="ok"></i>✓ 이미 제출함</span></div>
  </div>
</section>
<div class="dk-list" id="dk-list"></div>

  </main>
</div>

<script src="app.js"></script>
<script src="mail.js"></script>
<script src="js/contract-docs.js"></script>
<script src="shell.js"></script>
<script src="js/docs-common.js"></script>
<script src="js/docs-calendar.js"></script>
</body>
</html>
