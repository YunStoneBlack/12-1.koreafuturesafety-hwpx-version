<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>설정 - 기술지도 보고서</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="/img/logo-white.png" alt="한국미래안전" /></div>
    <nav class="nav">
      <a class="nav-item" href="/dashboard.html">현장 목록</a>
      <a class="nav-item" href="/staff.html">담당요원</a>
      <a class="nav-item active" href="/settings.html">설정</a>
    </nav>
    <div class="sidebar-foot">
      <div class="avatar" id="sidebar-avatar">-</div>
      <div>
        <div class="who" id="sidebar-name">-</div>
        <div class="role">직원</div>
      </div>
      <button id="logout-btn">로그아웃</button>
    </div>
  </aside>
  <main class="main">

<div class="topline">
  <div>
    <h1>설정</h1>
    <p class="page-sub">회사 전체에 적용되는 설정입니다.</p>
  </div>
</div>

<div id="error" class="error"></div>

<div class="panel">
  <div class="panel-head"><h2>Claude API 키</h2></div>
  <div class="panel-body">
  <p class="page-sub" style="margin:0 0 12px;">
    계약서 PDF로 현장 정보를 자동 인식하는 기능에 필요합니다.
    <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a>에서
    발급받은 키를 입력하세요. 회사 전체가 공유하는 키입니다.
  </p>
  <div id="current-status" class="status"></div>
  <form id="key-form">
    <label for="api-key">API 키</label>
    <input id="api-key" type="password" placeholder="sk-ant-..." autocomplete="off" />
    <button type="submit">저장</button>
  </form>
  </div>
</div>

<section class="panel">
  <div class="panel-head"><h2>결재란 도장 (이사 · 대표이사)</h2></div>
  <div class="panel-body">
  <p class="page-sub" style="margin:0 0 12px;">한 번 등록하면 이 회사의 모든 보고서 결재란에 자동으로 들어갑니다. 도장 스캔 이미지를 올리거나 직접 그릴 수 있습니다.</p>
  <div class="field-grid">
    <div><label>이사</label><div id="sig-director"></div></div>
    <div><label>대표이사</label><div id="sig-ceo"></div></div>
  </div>
  </div>
</section>

  </main>
</div>

<script src="/app.js"></script>
<script src="/signature.js"></script>
<script>
const errorEl = document.getElementById("error");

async function loadStatus() {
  const statusEl = document.getElementById("current-status");
  try {
    const status = await api("/settings/api-key");
    statusEl.textContent = status.has_key
      ? `현재 등록된 키: ${status.masked} (새 키를 입력하면 교체됩니다)`
      : "아직 등록된 키가 없습니다.";
  } catch (err) {
    showError(errorEl, err);
  }
}

document.getElementById("key-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.style.display = "none";
  const input = document.getElementById("api-key");
  try {
    await apiPost("/settings/api-key", { api_key: input.value });
    input.value = "";
    await loadStatus();
  } catch (err) {
    showError(errorEl, err);
  }
});

document.getElementById("logout-btn").addEventListener("click", async () => {
  await apiPost("/auth/logout");
  window.location.href = "/index.html";
});
api("/auth/me").then((me) => {
  document.getElementById("sidebar-name").textContent = me.display_name || me.email;
  document.getElementById("sidebar-avatar").textContent = (me.display_name || me.email || "?")[0];
}).catch(() => {});

loadStatus();

api("/settings/signatures").then((st) => {
  for (const role of ["director", "ceo"]) {
    createSignatureField(document.getElementById(`sig-${role}`), {
      imageUrl: `/api/settings/signatures/${role}`,
      uploadUrl: `/api/settings/signatures/${role}`,
      deleteUrl: `/api/settings/signatures/${role}`,
      registered: st[role],
    });
  }
}).catch((err) => showError(errorEl, err));
</script>
</body>
</html>
