<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>설정 - 기술지도 보고서</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-report-tab="settings">
<div class="app">
  <aside class="sidebar" id="gw-sidebar"></aside>
  <main class="main">

<p class="page-sub tab-intro">회사 전체에 적용되는 설정입니다.</p>

<div id="error" class="error"></div>

<div class="panel">
  <div class="panel-head"><h2>Claude API 키</h2></div>
  <div class="panel-body">
  <p class="page-sub" style="margin:0 0 12px;">
    계약서 PDF로 현장 정보를 자동 인식하는 기능에 필요합니다.
    <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a>에서
    발급받은 키를 입력하세요. 회사 전체가 공유하는 키입니다.
  </p>
  <div id="current-status" class="status"></div>
  <form id="key-form">
    <label for="api-key">API 키</label>
    <input id="api-key" type="password" placeholder="sk-ant-..." autocomplete="off" />
    <button type="submit">저장</button>
  </form>
  </div>
</div>

<section class="panel">
  <div class="panel-head"><h2>결재란 도장 (이사 · 대표이사)</h2></div>
  <div class="panel-body">
  <p class="page-sub" style="margin:0 0 12px;">한 번 등록하면 이 회사의 모든 보고서 결재란에 자동으로 들어갑니다. 도장 스캔 이미지를 올리거나 직접 그릴 수 있습니다.</p>
  <div class="field-grid">
    <div><label>이사</label><div id="sig-director"></div></div>
    <div><label>대표이사</label><div id="sig-ceo"></div></div>
  </div>
  </div>
</section>

  </main>
</div>

<script src="app.js"></script>
<script src="shell.js"></script>
<script src="signature.js"></script>
<script>
const errorEl = document.getElementById("error");

async function loadStatus() {
  const statusEl = document.getElementById("current-status");
  try {
    const status = await api("/settings/api-key");
    statusEl.textContent = status.has_key
      ? `현재 등록된 키: ${status.masked} (새 키를 입력하면 교체됩니다)`
      : "아직 등록된 키가 없습니다.";
  } catch (err) {
    showError(errorEl, err);
  }
}

document.getElementById("key-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.style.display = "none";
  const input = document.getElementById("api-key");
  try {
    await apiPost("/settings/api-key", { api_key: input.value });
    input.value = "";
    await loadStatus();
  } catch (err) {
    showError(errorEl, err);
  }
});


loadStatus();

api("/settings/signatures").then((st) => {
  for (const role of ["director", "ceo"]) {
    createSignatureField(document.getElementById(`sig-${role}`), {
      imageUrl: `${BASE}/api/settings/signatures/${role}`,
      uploadUrl: `${BASE}/api/settings/signatures/${role}`,
      deleteUrl: `${BASE}/api/settings/signatures/${role}`,
      registered: st[role],
    });
  }
}).catch((err) => showError(errorEl, err));
</script>
</body>
</html>
