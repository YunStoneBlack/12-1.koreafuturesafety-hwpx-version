<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>현장 목록 - 기술지도 보고서</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-report-tab="sites">
<div class="app">
  <aside class="sidebar" id="gw-sidebar"></aside>
  <main class="main">

<div id="error" class="error"></div>

<div class="list-toolbar">
  <input id="site-search" type="search" placeholder="현장명·주소·시공사·담당요원으로 검색" autocomplete="off" />
  <button type="button" id="new-site-toggle">+ 새 현장 등록</button>
</div>

<section class="panel" id="new-site-panel" hidden>
  <div class="panel-head">
    <h2>새 현장 등록</h2>
    <button type="button" class="secondary btn-sm" id="new-site-close">닫기</button>
  </div>
  <div class="panel-body">
  <label for="contract-file">계약서·공문 PDF로 자동 채우기 (선택)</label>
  <div class="inline-row">
    <input id="contract-file" type="file" accept="application/pdf" />
    <button type="button" id="extract-btn" class="secondary">AI로 자동 채우기</button>
  </div>
  <div id="extract-status" class="status"></div>

  <form id="site-form">
    <h3 class="form-group-title">현장</h3>
    <div class="field-grid">
      <div><label for="name">현장명</label><input id="name" required /></div>
      <div><label for="address">주소</label><input id="address" /></div>
      <div><label for="visit_address">지도 방문 주소 <span style="font-weight:400; color:var(--muted);">(보고서엔 안 나감)</span></label><input id="visit_address" placeholder="비우면 현장 주소와 같음 — 실제로 찾아가는 곳이 다를 때만" /></div>
      <div><label for="site_mgmt_no">사업장관리번호</label><input id="site_mgmt_no" /></div>
      <div><label for="biz_start_no">사업개시번호</label><input id="biz_start_no" /></div>
      <div><label for="period_start">공사기간 시작일</label><input id="period_start" type="date" /></div>
      <div><label for="period_end">공사기간 종료일</label><input id="period_end" type="date" /></div>
      <div><label for="amount">공사금액</label><input id="amount" type="number" min="0" /></div>
      <div><label for="total_guidance_count">기술지도 총 횟수</label><input id="total_guidance_count" type="number" min="0" /></div>
      <div><label for="assigned_staff_id">담당요원 <span style="font-weight:400; color:var(--muted);">(보고서에 자동 배정)</span></label>
        <select id="assigned_staff_id"><option value="">선택 안 함</option></select></div>
    </div>

    <h3 class="form-group-title">현장책임자</h3>
    <div class="field-grid">
      <div><label for="manager_name">이름</label><input id="manager_name" /></div>
      <div><label for="manager_phone">연락처</label><input id="manager_phone" /></div>
      <div><label for="manager_email">이메일</label><input id="manager_email" type="email" /></div>
    </div>

    <h3 class="form-group-title">발주처·감리단 <span style="font-weight:400; color:var(--muted); font-size:12px;">(선택 — 고객사 전송 때 받는 사람으로 체크, 메일 여러 개면 쉼표로)</span></h3>
    <div class="field-grid">
      <div><label for="owner_name">발주처 이름·기관명</label><input id="owner_name" placeholder="예: ○○시청 건설과" /></div>
      <div><label for="owner_email">발주처 메일</label><input id="owner_email" /></div>
      <div><label for="supervisor_name">감리단 이름·기관명</label><input id="supervisor_name" /></div>
      <div><label for="supervisor_email">감리단 메일</label><input id="supervisor_email" /></div>
    </div>

    <h3 class="form-group-title">시공사(건설업체)</h3>
    <div class="field-grid">
      <div><label for="hq_company">회사명</label><input id="hq_company" /></div>
      <div><label for="hq_phone">연락처</label><input id="hq_phone" /></div>
      <div><label for="corp_reg_no">법인등록번호</label><input id="corp_reg_no" /></div>
      <div><label for="biz_reg_no">사업자등록번호</label><input id="biz_reg_no" /></div>
      <div><label for="license_no">건설면허번호</label><input id="license_no" /></div>
      <div><label for="hq_address">주소</label><input id="hq_address" /></div>
    </div>

    <button type="submit">등록</button>
    <button type="button" class="secondary" id="new-site-cancel">취소</button>
  </form>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h2>현장 목록</h2><span class="panel-count" id="site-count"></span></div>
  <div class="rows" id="site-list"><div class="empty-note">불러오는 중...</div></div>
</div>

  </main>
</div>

<script src="app.js"></script>
<script src="shell.js"></script>
<script>
const errorEl = document.getElementById("error");

// site-form의 모든 입력칸 id 목록 — 자동채우기/등록/초기화에서 반복 사용.
const SITE_FIELD_IDS = [
  "name", "address", "site_mgmt_no", "biz_start_no",
  "period_start", "period_end", "amount", "total_guidance_count",
  "manager_name", "manager_phone", "manager_email",
  "hq_company", "corp_reg_no", "biz_reg_no", "license_no", "hq_phone", "hq_address",
];

function readSiteForm() {
  const body = {};
  for (const id of SITE_FIELD_IDS) {
    const el = document.getElementById(id);
    const raw = el.value;
    if (el.type === "number") {
      body[id] = raw === "" ? null : Number(raw);
    } else if (el.type === "date") {
      body[id] = raw || null;
    } else {
      body[id] = raw;
    }
  }
  // 담당요원 — 현장 ↔ 보고서 연동(보고서에서 바꾸면 현장도, 현장에서 바꾸면 작성 중 보고서도)
  const staffVal = document.getElementById("assigned_staff_id").value;
  body.assigned_staff_id = staffVal ? Number(staffVal) : null;
  return body;
}

// 등록 폼 담당요원 목록(활성 요원)
async function loadStaffOptions() {
  try {
    const select = document.getElementById("assigned_staff_id");
    for (const s of await api("/staff")) {
      const opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = s.phone ? `${s.name} (${s.phone})` : s.name;
      select.appendChild(opt);
    }
  } catch (err) {
    showError(errorEl, err);
  }
}

function fillSiteForm(data) {
  for (const id of SITE_FIELD_IDS) {
    if (!(id in data) || data[id] === null || data[id] === undefined) continue;
    document.getElementById(id).value = data[id];
  }
}

let allSites = [];

// "2026-09-20" → "09.20"(올해) / "25.09.20"(다른 해)
function shortDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return y === String(new Date().getFullYear()) ? `${m}.${d}` : `${y.slice(2)}.${m}.${d}`;
}

function renderSites() {
  const listEl = document.getElementById("site-list");
  const q = document.getElementById("site-search").value.trim().replace(/\s+/g, "").toLowerCase();
  const shown = allSites.filter((s) => !q || [s.name, s.address, s.hq_company, s.staff_name, s.manager_name, s.management_no]
    .some((v) => (v || "").replace(/\s+/g, "").toLowerCase().includes(q)));
  document.getElementById("site-count").textContent = q ? `${shown.length} / ${allSites.length}곳` : `${allSites.length}곳`;
  if (!allSites.length) {
    listEl.innerHTML = '<div class="empty-note">아직 등록된 현장이 없습니다. 위의 "+ 새 현장 등록"을 눌러 추가하세요.</div>';
    return;
  }
  if (!shown.length) {
    listEl.innerHTML = '<div class="empty-note">검색 결과가 없습니다.</div>';
    return;
  }
  listEl.innerHTML = "";
  for (const site of shown) {
    const row = document.createElement("a");
    row.className = "row site-row";
    row.href = `site.html?id=${site.id}`;
    const pillClass = site.status === "완료" ? "approved" : site.status === "보류" ? "rejected" : "pending";
    const progress = site.last_visit_no
      ? `${site.last_visit_no}${site.total_guidance_count ? ` / ${site.total_guidance_count}` : ""}회차`
      : "보고서 없음";
    row.innerHTML = `
      <span class="title"><span class="site-name"></span><span class="site-sub"></span></span>
      <span class="site-metas">
        <span class="meta" data-k="staff"></span>
        <span class="meta" data-k="progress"></span>
        <span class="meta" data-k="date"></span>
      </span>
      <span class="dday" hidden></span>
      <span class="status-pill ${pillClass}"></span>`;
    // 사용자 입력 값은 textContent로(따옴표·꺾쇠가 들어간 현장명도 안전하게)
    row.querySelector(".site-name").textContent = site.name;
    row.querySelector(".site-sub").textContent = [site.address, site.hq_company].filter(Boolean).join(" · ");
    const pace = sitePaceBox(site.pace); // 진행 막대(공기 경과 vs 지도 수행 — 데스크톱 현장 카드와 같음)
    if (pace) row.querySelector(".title").appendChild(pace);
    const links = siteLinkButtons(site.manager_phone, site.map_address); // [📞 전화] [📍 지도]
    if (links) row.querySelector(".title").appendChild(links);
    // 진행 요약(report_count 등)은 API 서버를 재시작해야 내려온다 — 없으면 "보고서 없음"처럼 틀리게 보이지 않게 비워 둔다
    const hasSummary = site.report_count !== undefined;
    row.querySelector('[data-k="staff"]').textContent = !hasSummary ? "" : site.staff_name ? `담당 ${site.staff_name}` : "담당 미지정";
    row.querySelector('[data-k="progress"]').textContent = hasSummary ? progress : "";
    row.querySelector('[data-k="date"]').textContent = site.last_guidance_date ? `최근 지도 ${shortDate(site.last_guidance_date)}` : "";
    row.querySelector(".status-pill").textContent = site.status;
    // 지도 기한(마지막 지도일 + 15일, server/api/deadlines.py) — 진행 중인 현장만. 임박·초과는 색으로 눈에 띄게
    if (site.deadline) {
      const dd = row.querySelector(".dday");
      const n = site.deadline_days_left;
      dd.hidden = false;
      dd.className = `dday ${site.deadline_stage}`;
      dd.textContent = n < 0 ? `기한 ${-n}일 지남` : n === 0 ? "오늘 기한" : `D-${n}`;
      dd.title = `지도 기한 ${site.deadline} (마지막 지도일 + 15일)`;
    }
    listEl.appendChild(row);
  }
}

async function loadSites() {
  try {
    allSites = await api("/sites");
    renderSites();
  } catch (err) {
    showError(errorEl, err);
  }
}

document.getElementById("site-search").addEventListener("input", renderSites);

// 새 현장 등록 폼은 평소엔 접어 두고 버튼으로 연다(항상 펼쳐 두면 현장 목록보다 폼이 더 커 보였다)
function setNewSiteOpen(open) {
  const panel = document.getElementById("new-site-panel");
  panel.hidden = !open;
  document.getElementById("new-site-toggle").hidden = open;
  if (open) {
    panel.scrollIntoView({ behavior: "smooth", block: "start" });
    document.getElementById("name").focus({ preventScroll: true });
  }
}
document.getElementById("new-site-toggle").addEventListener("click", () => setNewSiteOpen(true));
document.getElementById("new-site-close").addEventListener("click", () => setNewSiteOpen(false));
document.getElementById("new-site-cancel").addEventListener("click", () => setNewSiteOpen(false));

document.getElementById("extract-btn").addEventListener("click", async () => {
  errorEl.style.display = "none";
  const statusEl = document.getElementById("extract-status");
  const fileInput = document.getElementById("contract-file");
  const file = fileInput.files[0];
  if (!file) {
    statusEl.textContent = "먼저 PDF 파일을 선택하세요.";
    return;
  }
  statusEl.textContent = "AI가 문서를 분석하고 있습니다... (약 20초 소요)";

  const formData = new FormData();
  formData.append("file", file);
  try {
    // 파일 업로드는 app.js의 api()(JSON 전용)를 안 쓰고 직접 호출한다 — Content-Type을
    // 브라우저가 자동으로 multipart/form-data(boundary 포함)로 잡아줘야 하기 때문.
    const res = await fetch(BASE + "/api/sites/extract-from-contract", {
      method: "POST",
      credentials: "include",
      body: formData,
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `분석 실패 (${res.status})`);
    }
    const data = await res.json();
    fillSiteForm(data);
    statusEl.textContent = "자동 인식이 완료되었습니다. 내용을 확인·수정한 뒤 등록하세요.";
  } catch (err) {
    statusEl.textContent = "";
    showError(errorEl, err);
  }
});

document.getElementById("site-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.style.display = "none";
  try {
    const created = await apiPost("/sites", readSiteForm());
    const contacts = Object.fromEntries(["owner_name", "owner_email", "supervisor_name", "supervisor_email", "visit_address"]
      .map((id) => [id, document.getElementById(id).value.trim()]));
    if (Object.values(contacts).some(Boolean)) {
      try {
        await apiPatch(`/sites/${created.id}/contacts`, contacts);
      } catch (err) {
        alert(`현장은 등록했지만 발주처·감리단·지도 방문 주소는 저장하지 못했습니다(${err.message}). 현장 화면의 [수정]에서 다시 넣어 주세요.`);
      }
    }
    // 등록하면 바로 그 현장 화면으로(다음 할 일이 거기서 보고서 작성이라)
    window.location.href = `site.html?id=${created.id}`;
  } catch (err) {
    showError(errorEl, err);
  }
});


loadSites();
loadStaffOptions();
</script>
</body>
</html>
