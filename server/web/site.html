<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>현장 상세 - 기술지도 보고서</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="topbar">
  <h1 id="site-name">현장</h1>
  <a href="/dashboard.html">← 목록</a>
</div>

<div id="error" class="error"></div>

<div class="card">
  <h2>보고서 목록</h2>
  <div id="report-list">불러오는 중...</div>
  <button type="button" id="new-report-btn">+ 새 보고서 작성</button>
</div>

<script src="/app.js"></script>
<script>
const errorEl = document.getElementById("error");
const siteId = new URLSearchParams(window.location.search).get("id");

async function loadSite() {
  try {
    const site = await api(`/sites/${siteId}`);
    document.getElementById("site-name").textContent = site.name;
  } catch (err) {
    showError(errorEl, err);
  }
}

async function loadReports() {
  const listEl = document.getElementById("report-list");
  try {
    const reports = await api(`/sites/${siteId}/reports`);
    if (reports.length === 0) {
      listEl.textContent = "아직 작성된 보고서가 없습니다.";
      return;
    }
    listEl.innerHTML = "";
    for (const report of reports) {
      const row = document.createElement("div");
      row.className = "site-row";
      row.innerHTML =
        `<a href="/report.html?id=${report.id}">${report.visit_no}회차</a>` +
        `<span>${report.status === "final" ? "완료" : "작성중"}</span>`;
      listEl.appendChild(row);
    }
  } catch (err) {
    showError(errorEl, err);
  }
}

document.getElementById("new-report-btn").addEventListener("click", async () => {
  errorEl.style.display = "none";
  try {
    const report = await apiPost(`/sites/${siteId}/reports`, {});
    window.location.href = `/report.html?id=${report.id}`;
  } catch (err) {
    showError(errorEl, err);
  }
});

loadSite();
loadReports();
</script>
</body>
</html>
