<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>현장 상세 - 기술지도 보고서</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="css/site-info.css" />
<link rel="stylesheet" href="css/mail.css" />
<link rel="stylesheet" href="css/auto-plan.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="gw-sidebar"></aside>
  <main class="main">

<div class="crumb"><a href="dashboard.html">현장 목록</a><span class="sep">/</span><span id="site-name">현장</span></div>
<div class="topline"><h1 id="site-name-h1">현장</h1></div>

<div id="error" class="error"></div>

<section class="panel">
  <div class="panel-head">
    <h2>현장 정보</h2>
    <button type="button" class="secondary" id="site-edit-toggle" style="margin-top:0;">수정</button>
  </div>
  <div class="panel-body">
    <div id="mgmt-warning" class="status bad" style="display:none; margin:0 0 10px;">관리번호가 비어 있습니다 — 보고서 표지의 관리번호가 빈칸으로 나갑니다. "수정"에서 입력하거나 자동생성하세요.</div>
    <div id="site-summary" class="field-grid"></div>
    <form id="site-edit-form" style="display:none;">
      <div id="site-edit-fields" class="field-grid"></div>
      <button type="submit">저장</button>
      <button type="button" class="secondary" id="site-edit-cancel">취소</button>
      <div id="site-edit-status" class="status"></div>
    </form>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h2>보고서 목록</h2></div>
  <div class="rows" id="report-list">불러오는 중...</div>
</div>
<button type="button" id="new-report-btn">+ 새 보고서 작성</button>

<section class="panel danger-zone">
  <div class="panel-head"><h2>현장 삭제</h2></div>
  <div class="panel-body">
    <p class="page-sub" style="margin:0 0 12px;">이 현장과 <b id="del-report-count">모든 보고서</b>(사진·PDF·서명 포함)가 함께 삭제되며 되돌릴 수 없습니다.
      <span id="del-pw-hint">'설정' 탭에서 정한 삭제 비밀번호를 입력하세요.</span></p>
    <div class="inline-row">
      <input id="site-delete-pw" type="password" placeholder="삭제 비밀번호" autocomplete="off" style="max-width:260px;" />
      <button type="button" class="danger" id="site-delete-btn">현장 삭제</button>
    </div>
  </div>
</section>

  </main>
</div>

<script src="app.js"></script>
<script src="mail.js"></script>
<script src="js/auto-plan.js"></script>
<script src="shell.js"></script>
<script>
const errorEl = document.getElementById("error");
const siteId = new URLSearchParams(window.location.search).get("id");

// 현장 정보 — 데스크톱 현장 수정 폼과 같은 항목(대시보드 "새 현장 등록" 폼과 같은 필드) + 관리번호·기본 담당요원.
// PATCH /sites/{id}는 전체 필드를 받으므로 폼의 모든 값을 보낸다.
const SITE_FIELDS = [
  ["management_no", "관리번호 (표지)", "text"], ["name", "현장명", "text"], ["address", "주소", "text"],
  ["site_mgmt_no", "사업장관리번호", "text"], ["biz_start_no", "사업개시번호", "text"],
  ["period_start", "공사기간 시작일", "date"], ["period_end", "공사기간 종료일", "date"],
  ["amount", "공사금액(원)", "number"], ["total_guidance_count", "기술지도 총 횟수", "number"],
  ["manager_name", "현장책임자 이름", "text"], ["manager_phone", "현장책임자 연락처", "text"],
  ["manager_email", "현장책임자 이메일", "email"], ["hq_company", "시공사 회사명", "text"],
  ["corp_reg_no", "시공사 법인등록번호", "text"], ["biz_reg_no", "시공사 사업자등록번호", "text"],
  ["license_no", "시공사 건설면허번호", "text"], ["hq_phone", "시공사 연락처", "text"], ["hq_address", "시공사 주소", "text"],
];
let currentSite = null;
// 발주처·감리단(고객사 전송 받는 사람, GET/PATCH /sites/{id}/contacts) — 현장 정보 PATCH와 따로 저장(표지에 안 들어가 PDF에 영향 없음)
const CONTACT_FIELDS = [
  ["owner_name", "발주처 이름·기관명", "text"], ["owner_email", "발주처 메일 (여러 개면 쉼표로)", "text"],
  ["supervisor_name", "감리단 이름·기관명", "text"], ["supervisor_email", "감리단 메일 (여러 개면 쉼표로)", "text"],
];
let currentContacts = {};
let currentPace = null;

function renderSiteSummary(site) {
  const box = document.getElementById("site-summary");
  box.innerHTML = "";
  const shown = [["management_no", "관리번호"], ["period_start", "공사 시작"], ["period_end", "공사 종료"],
    ["amount", "공사금액"], ["total_guidance_count", "기술지도 총 횟수"], ["manager_name", "현장책임자"], ["hq_company", "시공사"]];
  for (const [key, label] of shown) {
    const div = document.createElement("div");
    div.style.marginBottom = "8px";
    let value = site[key];
    if (key === "amount" && value != null) value = Number(value).toLocaleString("ko-KR") + "원";
    if (key === "total_guidance_count" && value != null && (currentContacts.first_visit_no || 1) > 1) {
      value = `${value} (이 시스템은 ${currentContacts.first_visit_no}회차부터 — 1~${currentContacts.first_visit_no - 1}회는 예전에 함)`;
    }
    div.innerHTML = `<div class="slot-label"></div><div style="font-weight:500;"></div>`;
    div.children[0].textContent = label;
    div.children[1].textContent = value == null || value === "" ? "-" : value;
    box.appendChild(div);
  }
  for (const [role, label] of [["owner", "발주처"], ["supervisor", "감리단"]]) {
    const text = [currentContacts[`${role}_name`], currentContacts[`${role}_email`]].filter(Boolean).join(" · ");
    if (!text) continue;
    const div = document.createElement("div");
    div.style.marginBottom = "8px";
    div.innerHTML = `<div class="slot-label"></div><div style="font-weight:500; word-break:break-all;"></div>`;
    div.children[0].textContent = label;
    div.children[1].textContent = text;
    box.appendChild(div);
  }
  document.getElementById("mgmt-warning").style.display = site.management_no ? "none" : "block";
}

async function openSiteEdit() {
  const box = document.getElementById("site-edit-fields");
  box.innerHTML = "";
  let amountDiv = null; // 공사금액은 [총 횟수][첫 지도 회차]를 한 줄로 붙이려고 그 뒤로 미룬다
  for (const [key, label, type] of SITE_FIELDS) {
    const div = document.createElement("div");
    div.innerHTML = `<label for="sf-${key}"></label><input id="sf-${key}" type="${type}" ${type === "number" ? 'min="0"' : ""} />`;
    div.querySelector("label").textContent = label;
    div.querySelector("input").value = currentSite[key] ?? "";
    if (key === "amount") { amountDiv = div; continue; }
    if (key === "total_guidance_count") { // 총 횟수 바로 옆에 첫 지도 회차(이 시스템 전에 다녀온 회차가 있으면 — 2026-10-01 사용자)
      box.appendChild(div);
      const f = document.createElement("div");
      f.innerHTML = `<label for="sf-c-first_visit_no">첫 지도 회차 <span style="font-weight:400; color:var(--muted);">(이 시스템 전에 1~7회를 했으면 8)</span></label>
        <input id="sf-c-first_visit_no" type="number" min="1" />`;
      f.querySelector("input").value = currentContacts.first_visit_no || 1;
      box.appendChild(f);
      if (amountDiv) box.appendChild(amountDiv);
      continue;
    }
    if (key === "address") { // 주소 바로 밑에 지도 방문 주소(보고서엔 안 나감, 비우면 현장 주소)
      box.appendChild(div);
      const v = document.createElement("div");
      v.innerHTML = `<label for="sf-c-visit_address">지도 방문 주소 <span style="font-weight:400; color:var(--muted);">(보고서엔 안 나감 — [📍 지도]가 여는 곳)</span></label>
        <input id="sf-c-visit_address" placeholder="비우면 현장 주소와 같음 — 군부대처럼 실제로 찾아가는 곳이 다를 때만" />`;
      v.querySelector("input").value = currentContacts.visit_address ?? "";
      box.appendChild(v);
      continue;
    }
    if (key === "management_no") {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "secondary";
      btn.style.marginTop = "6px";
      btn.textContent = "자동생성";
      btn.addEventListener("click", async () => {
        try {
          const out = await api("/sites/next-management-no");
          document.getElementById("sf-management_no").value = out.management_no;
        } catch (err) {
          showError(errorEl, err);
        }
      });
      div.appendChild(btn);
    }
    box.appendChild(div);
  }
  for (const [key, label, type] of CONTACT_FIELDS) {
    const div = document.createElement("div");
    div.innerHTML = `<label for="sf-c-${key}"></label><input id="sf-c-${key}" type="${type}" />`;
    div.querySelector("label").textContent = label;
    div.querySelector("input").value = currentContacts[key] ?? "";
    box.appendChild(div);
  }
  const staffDiv = document.createElement("div");
  staffDiv.innerHTML = '<label for="sf-assigned_staff_id">담당요원 <span style="font-weight:400; color:var(--muted);">(작성 중인 보고서·새 보고서에도 함께 반영, PDF를 만든 과거 회차는 그대로)</span></label><select id="sf-assigned_staff_id"><option value="">선택 안 함</option></select>';
  box.appendChild(staffDiv);
  try {
    for (const st of await api("/staff")) {
      const opt = document.createElement("option");
      opt.value = st.id;
      opt.textContent = `${st.name} (${st.phone})`;
      staffDiv.querySelector("select").appendChild(opt);
    }
  } catch (err) {
    showError(errorEl, err);
  }
  staffDiv.querySelector("select").value = currentSite.assigned_staff_id ?? "";
  document.getElementById("site-edit-form").style.display = "block";
  document.getElementById("site-summary").style.display = "none";
}

function closeSiteEdit() {
  document.getElementById("site-edit-form").style.display = "none";
  document.getElementById("site-summary").style.display = "grid";
}

document.getElementById("site-edit-toggle").addEventListener("click", () => {
  if (document.getElementById("site-edit-form").style.display === "none") openSiteEdit();
  else closeSiteEdit();
});
document.getElementById("site-edit-cancel").addEventListener("click", closeSiteEdit);
document.getElementById("site-edit-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.style.display = "none";
  const body = {};
  for (const [key, , type] of SITE_FIELDS) {
    const v = document.getElementById(`sf-${key}`).value.trim();
    body[key] = type === "number" ? (v === "" ? null : Number(v)) : type === "date" ? (v || null) : v;
  }
  const staffVal = document.getElementById("sf-assigned_staff_id").value;
  body.assigned_staff_id = staffVal ? Number(staffVal) : null;
  if (!body.name) {
    showError(errorEl, new Error("현장명을 입력하세요."));
    return;
  }
  try {
    const contactBody = Object.fromEntries([...CONTACT_FIELDS.map(([key]) => key), "visit_address"]
      .map((key) => [key, document.getElementById(`sf-c-${key}`).value.trim()]));
    contactBody.first_visit_no = Number(document.getElementById("sf-c-first_visit_no").value) || 1; // 첫 지도 회차(웹판 전용 — PDF 영향 없음)
    currentContacts = await apiPatch(`/sites/${siteId}/contacts`, contactBody); // 메일 주소가 틀리면 여기서 400 — 현장 정보보다 먼저 확인
    // 현장 정보는 실제로 바뀐 게 있을 때만 저장 — 저장하면 표지가 바뀐 것으로 보고 이 현장 PDF가 전부 "수정 전 버전"이 되므로
    // (발주처·감리단만 고쳤을 때 PDF를 다시 만들 필요 없게, 2026-09-30)
    const norm = (v) => (v == null ? "" : String(v));
    let handoverMsg = "";
    if (Object.keys(body).some((k) => norm(body[k]) !== norm(currentSite[k]))) {
      const staffChanged = norm(body.assigned_staff_id) !== norm(currentSite.assigned_staff_id);
      await apiPatch(`/sites/${siteId}`, body);
      currentSite = await api(`/sites/${siteId}`); // 진행 막대(공기·총 횟수가 바뀌었을 수 있음)까지 새로
      if (staffChanged) handoverMsg = await handoverPlans(body.assigned_staff_id);
    }
    applySite(currentSite);
    if (handoverMsg) document.querySelector(".site-plan-msg").innerHTML = handoverMsg;
    closeSiteEdit();
  } catch (err) {
    showError(errorEl, err);
  }
});

function applySite(site) {
  document.getElementById("site-name").textContent = siteLabel(site); // "26-12)_현장명"(app.js)
  document.getElementById("site-name-h1").textContent = siteLabel(site);
  // 현장명 밑 [📞 전화] [📍 지도] — 지도는 지도 방문 주소(없으면 현장 주소)
  const top = document.getElementById("site-name-h1").parentElement;
  top.querySelectorAll(".site-links, .st-wrap, .pace, .site-plan").forEach((el) => el.remove());
  const links = siteLinkButtons(site.manager_phone, currentContacts.map_address || site.address);
  if (links) top.appendChild(links);
  const stWrap = document.createElement("div"); // 공사 상태 4칸(app.js) — 진행 막대 위 한 줄, 진행중만 출장 배치
  stWrap.className = "st-wrap";
  stWrap.appendChild(siteStatusSwitch(site));
  top.appendChild(stWrap);
  // 진행 막대 — 수정 저장 응답엔 pace가 없어 처음 불러온 값을 유지
  if (site.pace) currentPace = site.pace;
  const pace = sitePaceBox(currentPace);
  if (pace) top.appendChild(pace);
  top.appendChild(sitePlanBox(site));
  renderSiteSummary(site);
}

// 담당요원을 바꿨을 때 — 이 현장의 앞으로의 방문 예정도 새 담당자로 넘길지, 넘기면 새 담당자의 다른 현장과 같은 지역끼리 다시 묶을지
// (POST /sites/{id}/plans/handover, server/api/routers/plan_change.py — 📌 고정 예정은 날짜 그대로 요원만 바뀜)
async function handoverPlans(toStaffId) {
  try {
    const dry = await apiPost(`/sites/${siteId}/plans/handover`, { to_staff_id: toStaffId, dry_run: true });
    if (!dry.count) return;
    const sel = document.getElementById("sf-assigned_staff_id");
    const who = toStaffId ? sel.options[sel.selectedIndex].textContent.replace(/\s*\(.*\)\s*$/, "") : "담당 없음"; // 선택 칸 글자 "이름 (연락처)"에서 이름만
    if (!confirm(`이 현장의 앞으로의 방문 예정 ${dry.count}건도 새 담당자(${who})로 넘길까요?`)) return;
    const replan = !!toStaffId && dry.auto > 0 &&
      confirm(`${who}님의 다른 현장과 같은 지역끼리 같은 날로 다시 묶을까요?\n(자동으로 넣은 예정 ${dry.auto}건만 다시 짜고, 📌 고정 예정은 날짜 그대로)`);
    const res = await apiPost(`/sites/${siteId}/plans/handover`, { to_staff_id: toStaffId, replan });
    return `✓ 방문 예정 ${res.moved}건을 ${who}님께 넘겼습니다${replan ? "(같은 지역끼리 다시 묶음)" : ""} — <a href="calendar.html">방문 달력에서 보기</a>`;
  } catch (err) {
    showError(errorEl, err);
  }
  return "";
}

// [📅 지도 일정 자동 배치] — 이 현장만 기존 일정(같은 지역 출장)에 끼워 넣는다(js/auto-plan.js). 넣은 뒤 결과 한 줄 + 달력 링크.
function sitePlanBox(site) {
  const box = document.createElement("div");
  box.className = "site-plan";
  box.innerHTML = '<button type="button" class="secondary">📅 지도 일정 자동 배치</button><span class="site-plan-msg"></span>';
  box.querySelector("button").addEventListener("click", () => openSitePlan(site));
  return box;
}
function openSitePlan(site) {
  openAutoPlan({ siteId: site.id }, siteLabel(site), (res) => {
    const msg = document.querySelector(".site-plan-msg");
    if (msg) msg.innerHTML = `✓ 방문 예정 ${res.added}회를 넣었습니다 — <a href="calendar.html">방문 달력에서 보기</a>`;
  });
}

async function loadSite() {
  try {
    [currentSite, currentContacts] = await Promise.all([api(`/sites/${siteId}`), api(`/sites/${siteId}/contacts`).catch(() => ({}))]);
    applySite(currentSite);
    // 새 현장 등록에서 "자동으로 넣을까요?"에 [확인]하고 넘어온 경우(dashboard.html) — 미리보기 창을 바로 연다
    const q = new URLSearchParams(window.location.search);
    if (q.get("autoplan") === "1") {
      q.delete("autoplan");
      history.replaceState(null, "", `${location.pathname}?${q}`);
      openSitePlan(currentSite);
    }
  } catch (err) {
    showError(errorEl, err);
  }
}

async function loadReports() {
  const listEl = document.getElementById("report-list");
  try {
    const reports = await api(`/sites/${siteId}/reports`);
    reportCount = reports.length;
    document.getElementById("del-report-count").textContent = `보고서 ${reports.length}건`;
    if (reports.length === 0) {
      listEl.innerHTML = '<div class="empty-note">아직 작성된 보고서가 없습니다.</div>';
      return;
    }
    listEl.innerHTML = "";
    // 데스크톱 "보고서 이력"과 같은 줄 구성: 회차 · 지도일 · 공정률 · 상태 + 한글 내려받기 / 삭제
    for (const report of [...reports].reverse()) {
      const row = document.createElement("div");
      row.className = "row report-row";
      row.style.flexWrap = "wrap";
      // 현장 목록처럼 줄 어디를 눌러도 보고서로 — 줄 안의 버튼·링크(PDF 받기·한글·삭제)는 각자 동작만 한다
      // (버튼이 있어서 줄 전체를 <a>로 감쌀 수 없음). Ctrl/가운데 버튼은 새 탭.
      const openReport = (e) => {
        if (e.target.closest("a, button")) return;
        const url = `report.html?id=${report.id}`;
        if (e.ctrlKey || e.metaKey || e.button === 1) window.open(url, "_blank");
        else window.location.href = url;
      };
      row.addEventListener("click", openReport);
      row.addEventListener("auxclick", (e) => { if (e.button === 1) openReport(e); });
      const isFinal = report.status === "final";
      row.innerHTML =
        `<span class="title"><a href="report.html?id=${report.id}">${report.visit_no}회차</a>` +
        `<span class="meta" style="margin-left:10px;">${report.guidance_date || "지도일 미입력"} · 공정률 ${report.progress_rate ?? 0}%</span>` +
        // 고객사에 메일로 보낸 적이 있으면 마지막 전송(누르면 전송 창에서 전체 기록)
        // 여러 곳에 보냈으면 "(3곳)" — 누구에게 보냈는지는 마우스를 올리면(title) 보임
        (report.last_mail_at ? (() => {
          const n = report.last_mail_to.split(",").filter((a) => a.trim()).length;
          return `<span class="mail-sent" title="${report.last_mail_to.replace(/"/g, "&quot;")}">✓ ${report.last_mail_at.slice(5).replace("-", "/")} 전송${n > 1 ? `(${n}곳)` : ""}</span>`;
        })() : "") +
        `</span>` +
        // PDF를 만든 보고서만 "고객사 전송"(수정 전 버전이면 창에서 "PDF를 다시 만든 뒤 보내세요"로 막음, mail.js)
        (isFinal ? `<button type="button" class="secondary rp-mail" title="고객사에 PDF 메일 보내기">📧 <span class="rp-mail-long">고객사 </span>전송</button>` : "") +
        // PDF를 만든 뒤 내용을 고쳤으면 "수정 전 버전" — 받을 순 있지만 최신이 아님(보고서 화면에서 "PDF 생성"을 다시 누르면 갱신)
        (!isFinal
          ? `<span class="status-pill pending">작성중</span>`
          : report.pdf_outdated
            ? `<a class="status-pill pending pdf-pill" data-download="pdf" data-report-id="${report.id}" href="${BASE}/api/reports/${report.id}/pdf" title="PDF를 만든 뒤 내용을 고쳤습니다. 보고서 화면에서 'PDF 생성'을 다시 누르면 최신이 됩니다. (눌러서 수정 전 PDF 받기)">PDF 수정 전 버전 ↓</a>`
            : `<a class="status-pill approved pdf-pill" data-download="pdf" data-report-id="${report.id}" href="${BASE}/api/reports/${report.id}/pdf" title="눌러서 PDF 받기">PDF 생성됨 ↓</a>`) +
        `<a class="secondary-link" data-download="hwpx" data-report-id="${report.id}" href="${BASE}/api/reports/${report.id}/hwpx">↓ 한글</a>` +
        `<button type="button" class="secondary rp-del" style="margin-top:0; color:var(--crit);">삭제</button>`;
      row.querySelector(".rp-mail")?.addEventListener("click", () => {
        openMailModal(report.id, `${currentSite ? currentSite.name + " " : ""}${report.visit_no}회차`, loadReports);
      });
      row.querySelector(".rp-del").addEventListener("click", async () => {
        if (!confirm(`${report.visit_no}회차 보고서를 삭제할까요? 되돌릴 수 없습니다.`)) return;
        errorEl.style.display = "none";
        try {
          await api(`/reports/${report.id}`, { method: "DELETE" });
          loadReports();
        } catch (err) {
          showError(errorEl, err);
        }
      });
      listEl.appendChild(row);
    }
  } catch (err) {
    showError(errorEl, err);
  }
}

document.getElementById("new-report-btn").addEventListener("click", async () => {
  errorEl.style.display = "none";
  try {
    const report = await apiPost(`/sites/${siteId}/reports`, {});
    window.location.href = `report.html?id=${report.id}`;
  } catch (err) {
    showError(errorEl, err);
  }
});

// 현장 삭제 — 되돌릴 수 없어서 '설정' 탭에서 정한 회사 공용 삭제 비밀번호를 알아야 지운다(서버가 확인)
let reportCount = 0;
async function deleteSite() {
  if (!currentSite) return;
  const pwInput = document.getElementById("site-delete-pw");
  if (!pwInput.value) {
    showError(errorEl, new Error("삭제 비밀번호를 입력하세요."));
    pwInput.focus();
    return;
  }
  if (!confirm(`"${currentSite.name}" 현장과 보고서 ${reportCount}건을 모두 삭제할까요? 되돌릴 수 없습니다.`)) return;
  errorEl.style.display = "none";
  try {
    await api(`/sites/${siteId}`, { method: "DELETE", body: JSON.stringify({ password: pwInput.value }) });
    window.location.href = "dashboard.html";
  } catch (err) {
    pwInput.value = "";
    showError(errorEl, err);
    errorEl.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}
document.getElementById("site-delete-btn").addEventListener("click", deleteSite);
document.getElementById("site-delete-pw").addEventListener("keydown", (e) => {
  if (e.key === "Enter") deleteSite();
});
// 삭제 비밀번호를 아직 안 정했으면 미리 안내(설정 탭으로 가는 링크)
api("/settings/delete-password").then((st) => {
  if (st.is_set) return;
  document.getElementById("del-pw-hint").innerHTML = '삭제 비밀번호가 아직 없습니다 — <a href="settings.html">설정 탭</a>에서 먼저 정하세요.';
}).catch(() => {});

loadSite();
loadReports();
</script>
</body>
</html>
