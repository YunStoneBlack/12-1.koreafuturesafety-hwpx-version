<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>현장 상세 - 기술지도 보고서</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="img/logo-white.png" alt="한국미래안전" /></div>
    <nav class="nav">
      <a class="nav-item active" href="dashboard.html">현장 목록</a>
      <a class="nav-item" href="staff.html">담당요원</a>
      <a class="nav-item" href="settings.html">설정</a>
    </nav>
    <div class="sidebar-foot">
      <div class="avatar" id="sidebar-avatar">-</div>
      <div>
        <div class="who" id="sidebar-name">-</div>
        <div class="role">직원</div>
      </div>
      <button id="logout-btn">로그아웃</button>
    </div>
  </aside>
  <main class="main">

<div class="crumb"><a href="dashboard.html">현장 목록</a><span class="sep">/</span><span id="site-name">현장</span></div>
<div class="topline"><h1 id="site-name-h1">현장</h1></div>

<div id="error" class="error"></div>

<section class="panel">
  <div class="panel-head">
    <h2>현장 정보</h2>
    <button type="button" class="secondary" id="site-edit-toggle" style="margin-top:0;">수정</button>
  </div>
  <div class="panel-body">
    <div id="mgmt-warning" class="status bad" style="display:none; margin:0 0 10px;">관리번호가 비어 있습니다 — 보고서 표지의 관리번호가 빈칸으로 나갑니다. "수정"에서 입력하거나 자동생성하세요.</div>
    <div id="site-summary" class="field-grid"></div>
    <form id="site-edit-form" style="display:none;">
      <div id="site-edit-fields" class="field-grid"></div>
      <button type="submit">저장</button>
      <button type="button" class="secondary" id="site-edit-cancel">취소</button>
      <div id="site-edit-status" class="status"></div>
    </form>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h2>보고서 목록</h2></div>
  <div class="rows" id="report-list">불러오는 중...</div>
</div>
<button type="button" id="new-report-btn">+ 새 보고서 작성</button>

  </main>
</div>

<script src="app.js"></script>
<script>
const errorEl = document.getElementById("error");
const siteId = new URLSearchParams(window.location.search).get("id");

// 현장 정보 — 데스크톱 현장 수정 폼과 같은 항목(대시보드 "새 현장 등록" 폼과 같은 필드) + 관리번호·기본 담당요원.
// PATCH /sites/{id}는 전체 필드를 받으므로 폼의 모든 값을 보낸다.
const SITE_FIELDS = [
  ["management_no", "관리번호 (표지)", "text"], ["name", "현장명", "text"], ["address", "주소", "text"],
  ["site_mgmt_no", "사업장관리번호", "text"], ["biz_start_no", "사업개시번호", "text"],
  ["period_start", "공사기간 시작일", "date"], ["period_end", "공사기간 종료일", "date"],
  ["amount", "공사금액(원)", "number"], ["total_guidance_count", "기술지도 총 횟수", "number"],
  ["manager_name", "현장책임자 이름", "text"], ["manager_phone", "현장책임자 연락처", "text"],
  ["manager_email", "현장책임자 이메일", "email"], ["hq_company", "시공사 회사명", "text"],
  ["corp_reg_no", "시공사 법인등록번호", "text"], ["biz_reg_no", "시공사 사업자등록번호", "text"],
  ["license_no", "시공사 건설면허번호", "text"], ["hq_phone", "시공사 연락처", "text"], ["hq_address", "시공사 주소", "text"],
];
let currentSite = null;

function renderSiteSummary(site) {
  const box = document.getElementById("site-summary");
  box.innerHTML = "";
  const shown = [["management_no", "관리번호"], ["period_start", "공사 시작"], ["period_end", "공사 종료"],
    ["amount", "공사금액"], ["total_guidance_count", "기술지도 총 횟수"], ["manager_name", "현장책임자"], ["hq_company", "시공사"]];
  for (const [key, label] of shown) {
    const div = document.createElement("div");
    div.style.marginBottom = "8px";
    let value = site[key];
    if (key === "amount" && value != null) value = Number(value).toLocaleString("ko-KR") + "원";
    div.innerHTML = `<div class="slot-label"></div><div style="font-weight:500;"></div>`;
    div.children[0].textContent = label;
    div.children[1].textContent = value == null || value === "" ? "-" : value;
    box.appendChild(div);
  }
  document.getElementById("mgmt-warning").style.display = site.management_no ? "none" : "block";
}

async function openSiteEdit() {
  const box = document.getElementById("site-edit-fields");
  box.innerHTML = "";
  for (const [key, label, type] of SITE_FIELDS) {
    const div = document.createElement("div");
    div.innerHTML = `<label for="sf-${key}"></label><input id="sf-${key}" type="${type}" ${type === "number" ? 'min="0"' : ""} />`;
    div.querySelector("label").textContent = label;
    div.querySelector("input").value = currentSite[key] ?? "";
    if (key === "management_no") {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "secondary";
      btn.style.marginTop = "6px";
      btn.textContent = "자동생성";
      btn.addEventListener("click", async () => {
        try {
          const out = await api("/sites/next-management-no");
          document.getElementById("sf-management_no").value = out.management_no;
        } catch (err) {
          showError(errorEl, err);
        }
      });
      div.appendChild(btn);
    }
    box.appendChild(div);
  }
  const staffDiv = document.createElement("div");
  staffDiv.innerHTML = '<label for="sf-assigned_staff_id">기본 담당요원 (새 보고서에 자동 배정)</label><select id="sf-assigned_staff_id"><option value="">선택 안 함</option></select>';
  box.appendChild(staffDiv);
  try {
    for (const st of await api("/staff")) {
      const opt = document.createElement("option");
      opt.value = st.id;
      opt.textContent = `${st.name} (${st.phone})`;
      staffDiv.querySelector("select").appendChild(opt);
    }
  } catch (err) {
    showError(errorEl, err);
  }
  staffDiv.querySelector("select").value = currentSite.assigned_staff_id ?? "";
  document.getElementById("site-edit-form").style.display = "block";
  document.getElementById("site-summary").style.display = "none";
}

function closeSiteEdit() {
  document.getElementById("site-edit-form").style.display = "none";
  document.getElementById("site-summary").style.display = "grid";
}

document.getElementById("site-edit-toggle").addEventListener("click", () => {
  if (document.getElementById("site-edit-form").style.display === "none") openSiteEdit();
  else closeSiteEdit();
});
document.getElementById("site-edit-cancel").addEventListener("click", closeSiteEdit);
document.getElementById("site-edit-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.style.display = "none";
  const body = {};
  for (const [key, , type] of SITE_FIELDS) {
    const v = document.getElementById(`sf-${key}`).value.trim();
    body[key] = type === "number" ? (v === "" ? null : Number(v)) : type === "date" ? (v || null) : v;
  }
  const staffVal = document.getElementById("sf-assigned_staff_id").value;
  body.assigned_staff_id = staffVal ? Number(staffVal) : null;
  if (!body.name) {
    showError(errorEl, new Error("현장명을 입력하세요."));
    return;
  }
  try {
    currentSite = await apiPatch(`/sites/${siteId}`, body);
    applySite(currentSite);
    closeSiteEdit();
  } catch (err) {
    showError(errorEl, err);
  }
});

function applySite(site) {
  document.getElementById("site-name").textContent = site.name;
  document.getElementById("site-name-h1").textContent = site.name;
  renderSiteSummary(site);
}

async function loadSite() {
  try {
    currentSite = await api(`/sites/${siteId}`);
    applySite(currentSite);
  } catch (err) {
    showError(errorEl, err);
  }
}

async function loadReports() {
  const listEl = document.getElementById("report-list");
  try {
    const reports = await api(`/sites/${siteId}/reports`);
    if (reports.length === 0) {
      listEl.innerHTML = '<div class="empty-note">아직 작성된 보고서가 없습니다.</div>';
      return;
    }
    listEl.innerHTML = "";
    // 데스크톱 "보고서 이력"과 같은 줄 구성: 회차 · 지도일 · 공정률 · 상태 + 한글 내려받기 / 삭제
    for (const report of [...reports].reverse()) {
      const row = document.createElement("div");
      row.className = "row";
      row.style.flexWrap = "wrap";
      const isFinal = report.status === "final";
      row.innerHTML =
        `<span class="title"><a href="report.html?id=${report.id}">${report.visit_no}회차</a>` +
        `<span class="meta" style="margin-left:10px;">${report.guidance_date || "지도일 미입력"} · 공정률 ${report.progress_rate ?? 0}%</span></span>` +
        `<span class="status-pill ${isFinal ? "approved" : "pending"}">${isFinal ? "PDF 생성됨" : "작성중"}</span>` +
        `<a class="secondary-link" href="${BASE}/api/reports/${report.id}/hwpx">↓ 한글</a>` +
        `<button type="button" class="secondary rp-del" style="margin-top:0; color:var(--crit);">삭제</button>`;
      row.querySelector(".rp-del").addEventListener("click", async () => {
        if (!confirm(`${report.visit_no}회차 보고서를 삭제할까요? 되돌릴 수 없습니다.`)) return;
        errorEl.style.display = "none";
        try {
          await api(`/reports/${report.id}`, { method: "DELETE" });
          loadReports();
        } catch (err) {
          showError(errorEl, err);
        }
      });
      listEl.appendChild(row);
    }
  } catch (err) {
    showError(errorEl, err);
  }
}

document.getElementById("new-report-btn").addEventListener("click", async () => {
  errorEl.style.display = "none";
  try {
    const report = await apiPost(`/sites/${siteId}/reports`, {});
    window.location.href = `report.html?id=${report.id}`;
  } catch (err) {
    showError(errorEl, err);
  }
});

document.getElementById("logout-btn").addEventListener("click", async () => {
  await apiPost("/auth/logout");
  window.location.href = "index.html";
});
api("/auth/me").then((me) => {
  document.getElementById("sidebar-name").textContent = me.display_name || me.email;
  document.getElementById("sidebar-avatar").textContent = (me.display_name || me.email || "?")[0];
}).catch(() => {});

loadSite();
loadReports();
</script>
</body>
</html>
