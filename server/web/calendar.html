<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>방문 달력 - 기술지도 보고서</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="css/site-info.css" />
<link rel="stylesheet" href="css/calendar.css" />
<link rel="stylesheet" href="css/mail.css" />
<link rel="stylesheet" href="css/auto-plan.css" />
<link rel="stylesheet" href="css/plan-change.css" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body data-report-tab="calendar">
<div class="app">
  <aside class="sidebar" id="gw-sidebar"></aside>
  <main class="main">

<div id="error" class="error"></div>
<div id="ap-notice"></div>

<div class="cal-filter">
  <div class="cal-seg" role="group" aria-label="볼 사람">
    <button type="button" data-mode="me">나만</button><button type="button" data-mode="pick">고른 요원</button><button type="button" data-mode="all">전체</button>
  </div>
  <div class="cal-chips" id="cal-chips"></div>
  <button type="button" class="secondary cal-autoplan" id="cal-autoplan" title="지금 보고 있는 요원들의 진행 중 현장 전부 — 넣기 전에 미리 보여 줍니다">📅 자동 배치</button>
</div>

<div class="cal-wrap">
  <section class="panel">
    <div class="panel-body">
      <div id="cal"></div>
      <div class="cal-legend">
        <span><i class="lg ev-plan"></i>방문 예정</span>
        <span><i class="lg ev-missed"></i>지난 예정(보고서 없음)</span>
        <span><i class="lg ev-writing"></i>다녀옴·보고서 작성 중</span>
        <span><i class="lg ev-submitted"></i>제출 완료</span>
        <span><i class="lg ev-sub"></i>대타 필요(거리가 멀어 담당 요원이 못 감)</span>
        <span class="cal-drag-hint">PC에선 예정을 끌어서 날짜를 옮길 수 있습니다.</span>
      </div>
    </div>
  </section>
  <section class="panel cal-day" id="cal-day">
    <div class="panel-body" id="cal-day-body"></div>
  </section>
</div>

  </main>
</div>

<script src="app.js"></script>
<script src="shell.js"></script>
<script src="js/auto-plan.js"></script>
<script src="js/plan-change.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
