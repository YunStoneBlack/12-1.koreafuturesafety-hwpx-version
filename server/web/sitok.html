<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시특법 - 보고서 자동화</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="css/site-info.css" />
<link rel="stylesheet" href="css/mail.css" />
<link rel="stylesheet" href="css/sitok.css" />
</head>
<!-- 보고서 자동화 · 시특법(2026-10-10) — 시설물 정기안전점검. 그룹웨어 왼쪽 메뉴 [보고서 자동화] 아래 "시특법" 소메뉴가 여는 메인 = 시설물 목록.
     설계·결정은 바탕화면 "시특법 견본\인수인계.md". 서버 server/api/routers/sitok.py, 화면 js/sitok.js, 등록·고치기 sitok-facility.html. -->
<body data-report-tab="facilities" data-law="sitok">
<div class="app">
  <aside class="sidebar" id="gw-sidebar"></aside>
  <main class="main">

<div id="error" class="error"></div>

<div class="list-toolbar sk-toolbar">
  <input id="sk-search" type="search" placeholder="시설물명·번호(민간-3)·주소·관리주체·시설물번호 검색" />
  <a class="sk-new" href="sitok-new.html">+ 점검 대상 등록</a>
</div>
<!-- 10/13 사용자: 산안법 현장 목록과 같은 정렬(최근 열람순·번호순 ▼▲) + 민간·관급 거르기, 민재형: 목록함 구분 카드(장기·지속 / 1회성·입찰 / 지속계약 종료) -->
<div class="sk-subbar">
  <span class="site-sort sk-sector-f" role="group" aria-label="민간·관급"><button type="button" data-sector="">전체</button><button type="button" data-sector="민간">민간</button><button type="button" data-sector="관급">관급</button></span>
  <span class="site-sort sk-sort" role="group" aria-label="정렬"><button type="button" data-sort="viewed">최근 열람순</button><button type="button" data-sort="no">번호순</button></span>
</div>
<div class="sc-cards sk-cards" id="sk-cards" role="group" aria-label="계약 구분별 시설물 수"></div>
<!-- 10/15 민재형 문서번호 일치화: 뱃지(분야·관급 종류)별 개수 — 누르면 그것만 -->
<div class="sk-badges" id="sk-badges" role="group" aria-label="뱃지별 시설물 수"></div>

<section class="panel">
  <div class="panel-head"><h2>시설물 목록</h2><span class="panel-count" id="sk-count"></span>
    <span class="sk-bulk"><label class="sk-check-all"><input type="checkbox" id="sk-all" /> 전체 선택</label>
      <button type="button" class="danger btn-sm" id="sk-del-sel" disabled>선택 삭제</button></span></div>
  <div id="sk-list"></div>
</section>

<p class="page-sub sk-next">다음에 열릴 것: 시특법 설정(참여 인원·등록증·장비) → 보고서 뼈대(PDF) → 현장 폰 화면(전회차 결함 다시 찍기) → AI 초안.</p>

  </main>
</div>

<script src="app.js"></script>
<script src="shell.js"></script>
<script src="js/sitok.js"></script>
</body>
</html>
