<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>담당요원 - 기술지도 보고서</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-report-tab="staff">
<div class="app">
  <aside class="sidebar" id="gw-sidebar"></aside>
  <main class="main">

<p class="page-sub tab-intro">등록한 서명은 그 요원이 담당하는 모든 보고서에 자동으로 들어갑니다.</p>

<div id="error" class="error"></div>

<section class="panel" id="manual-add" hidden>
  <div class="panel-head"><h2>새 담당요원 추가</h2></div>
  <div class="panel-body">
    <div class="field-grid">
      <div><label for="new-name">이름</label><input id="new-name" placeholder="예: 홍길동" /></div>
      <div><label for="new-phone">연락처</label><input id="new-phone" placeholder="예: 010-1234-5678" /></div>
      <div><label for="new-email">메일 <span style="font-weight:400; color:var(--muted);">(지도 기한 알림 받는 곳)</span></label><input id="new-email" type="email" placeholder="예: name@naver.com" /></div>
    </div>
    <button type="button" id="add-btn">+ 추가</button>
    <p class="page-sub" style="margin:8px 0 0;">추가한 뒤 목록에서 "수정"을 눌러 서명을 등록하세요.</p>
  </div>
</section>

<section class="panel">
  <div class="panel-head"><h2>담당요원 목록</h2></div>
  <div class="rows" id="staff-list"><div class="empty-note">불러오는 중...</div></div>
</section>

<section class="panel" id="unlinked-panel" hidden>
  <div class="panel-head"><h2>그룹웨어 직원과 이어지지 않은 담당요원</h2></div>
  <p class="page-sub" style="margin:0; padding:10px 18px 0;">지난 보고서에 남아 있는 담당요원입니다. 같은 사람이면 그룹웨어 직원을 골라 [잇기]를 누르세요 — 보고서·현장 배정·서명이 그대로 이어집니다.</p>
  <div class="rows" id="unlinked-list"></div>
</section>

  </main>
</div>

<script src="app.js"></script>
<script src="shell.js"></script>
<script src="signature.js"></script>
<script src="js/staff-gw.js"></script>
<script>
const errorEl = document.getElementById("error");

// 요원 한 줄: 이름(연락처) · 서명 미리보기(보기 전용) · 수정/비활성화/삭제.
// "수정"을 누르면 아래에 이름·연락처·서명을 한 번에 고치는 칸이 열린다(예전 "서명" 버튼은 여기로 합침).
// 서명은 signature.js — 저장을 누르기 전엔 반영 안 되고 되돌리기가 있어서, 손이 스쳐도 원래 서명은 안전하다.
function staffRow(s) {
  const wrap = document.createElement("div");
  wrap.className = "staff-item";
  wrap.innerHTML = `
    <div class="row staff-row">
      <span class="title staff-name"></span>
      ${s.has_signature
        ? `<img class="sig-thumb" alt="" src="${BASE}/api/staff/${s.id}/signature?ts=${Date.now()}" />`
        : '<span class="sig-thumb empty">서명 없음</span>'}
      ${s.active ? "" : '<span class="status-pill rejected">비활성</span>'}
      <span class="staff-actions">
        <button type="button" class="secondary st-edit">수정</button>
        <button type="button" class="secondary st-toggle">${s.active ? "비활성화" : "활성화"}</button>
        <button type="button" class="secondary st-del" style="color:var(--crit);">삭제</button>
      </span>
    </div>
    <div class="st-panel" hidden></div>
  `;
  wrap.querySelector(".staff-name").textContent = [s.name, s.phone && `(${s.phone})`, s.email && `· ${s.email}`].filter(Boolean).join(" ");
  const thumb = wrap.querySelector("img.sig-thumb");
  if (thumb) thumb.alt = `${s.name} 서명`;
  const panel = wrap.querySelector(".st-panel");
  const editBtn = wrap.querySelector(".st-edit");
  let sigField = null;

  const closeEdit = () => {
    if (sigField && sigField.isDirty() && !confirm("저장하지 않은 서명 변경이 있습니다. 닫을까요?")) return;
    panel.hidden = true;
    panel.innerHTML = "";
    sigField = null;
    editBtn.textContent = "수정";
  };
  const openEdit = () => {
    panel.hidden = false;
    editBtn.textContent = "닫기";
    panel.innerHTML = `
      <div class="field-grid">
        <div><label>이름</label><input class="e-name" /></div>
        <div><label>연락처</label><input class="e-phone" /></div>
        <div><label>메일 <span style="font-weight:400; color:var(--muted);">(지도 기한 알림)</span></label><input class="e-email" type="email" /></div>
      </div>
      <label>서명</label>
      <div class="e-sig"></div>
      <div class="edit-actions">
        <button type="button" class="e-save">저장</button>
        <button type="button" class="secondary e-cancel">취소</button>
      </div>`;
    panel.querySelector(".e-name").value = s.name;
    panel.querySelector(".e-phone").value = s.phone;
    panel.querySelector(".e-email").value = s.email || "";
    sigField = createSignatureField(panel.querySelector(".e-sig"), {
      imageUrl: `${BASE}/api/staff/${s.id}/signature`,
      uploadUrl: `${BASE}/api/staff/${s.id}/signature`,
      deleteUrl: `${BASE}/api/staff/${s.id}/signature`,
      registered: s.has_signature,
      standalone: false,
      title: `${s.name} 서명`,
    });
    panel.querySelector(".e-cancel").addEventListener("click", closeEdit);
    panel.querySelector(".e-save").addEventListener("click", async (e) => {
      errorEl.style.display = "none";
      e.target.disabled = true;
      try {
        await apiPatch(`/staff/${s.id}`, {
          name: panel.querySelector(".e-name").value, phone: panel.querySelector(".e-phone").value, email: panel.querySelector(".e-email").value,
        });
        if (!(await sigField.save())) return; // 서명 삭제 확인에서 취소 — 창은 그대로 둔다
        loadStaff();
      } catch (err) {
        showError(errorEl, err);
      } finally {
        e.target.disabled = false;
      }
    });
  };
  editBtn.addEventListener("click", () => (panel.hidden ? openEdit() : closeEdit()));
  wrap.querySelector(".st-toggle").addEventListener("click", async () => {
    errorEl.style.display = "none";
    try {
      await apiPatch(`/staff/${s.id}`, { active: !s.active });
      loadStaff();
    } catch (err) {
      showError(errorEl, err);
    }
  });
  wrap.querySelector(".st-del").addEventListener("click", async () => {
    if (!confirm(`${s.name} 요원을 삭제할까요? 이미 배정된 현장/보고서에서는 담당요원이 빈 값이 됩니다.`)) return;
    errorEl.style.display = "none";
    try {
      await api(`/staff/${s.id}`, { method: "DELETE" });
      loadStaff();
    } catch (err) {
      showError(errorEl, err);
    }
  });
  return wrap;
}

async function loadStaff() {
  const list = document.getElementById("staff-list");
  try {
    const rows = await api("/staff/all");
    list.innerHTML = rows.length ? "" : '<div class="empty-note">아직 등록된 담당요원이 없습니다.</div>';
    for (const s of rows) list.appendChild(staffRow(s));
  } catch (err) {
    showError(errorEl, err);
  }
}

document.getElementById("add-btn").addEventListener("click", async () => {
  errorEl.style.display = "none";
  const name = document.getElementById("new-name");
  const phone = document.getElementById("new-phone");
  const email = document.getElementById("new-email");
  try {
    await apiPost("/staff", { name: name.value, phone: phone.value, email: email.value });
    name.value = "";
    phone.value = "";
    email.value = "";
    loadStaff();
  } catch (err) {
    showError(errorEl, err);
  }
});

// 그룹웨어 직원정보로 관리(staff-gw.js). 그룹웨어 목록·새 API를 못 쓰면 예전 화면(직접 추가·수정).
initGroupwareStaff().then((ok) => {
  if (ok) return;
  document.getElementById("manual-add").hidden = false;
  loadStaff();
});
</script>
</body>
</html>
