<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>로그인 - 기술지도 보고서</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="center-page">
  <div style="width:100%; max-width:360px;">
    <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:20px;">
      <img src="/img/logo.png" alt="한국미래안전" style="height:44px; margin-bottom:14px;" />
      <div style="font-size:15px; font-weight:600; color:var(--ink);">기술지도 결과보고서</div>
    </div>
    <div class="form-card">
      <div id="error" class="error"></div>
      <form id="login-form">
        <label for="email">이메일</label>
        <input id="email" type="email" required autocomplete="username" />
        <label for="password">비밀번호</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <button type="submit" style="width:100%; justify-content:center; margin-top:18px;">로그인</button>
      </form>
    </div>
  </div>
</div>
<script src="/app.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("error");
  errorEl.style.display = "none";
  try {
    await apiPost("/auth/login", {
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
    });
    window.location.href = "/dashboard.html";
  } catch (err) {
    showError(errorEl, err);
  }
});
</script>
</body>
</html>
