<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>로그인 - 기술지도 보고서</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body style="visibility:hidden;">
<div class="center-page">
  <div style="width:100%; max-width:360px;">
    <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:20px;">
      <img src="img/logo.png" alt="한국미래안전" style="height:44px; margin-bottom:14px;" />
      <div style="font-size:15px; font-weight:600; color:var(--ink);">기술지도 결과보고서</div>
    </div>
    <div class="form-card">
      <div id="error" class="error"></div>
      <form id="login-form">
        <label for="email">이메일</label>
        <input id="email" type="email" required autocomplete="username" />
        <label for="password">비밀번호</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <button type="submit" style="width:100%; justify-content:center; margin-top:18px;">로그인</button>
      </form>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>
// 입구 — 이미 로그인된 상태(그룹웨어 모드에선 그룹웨어 로그인 = 보고서 로그인)면 바로 현장 목록으로.
// 아닐 때만 이 화면을 보여준다(그룹웨어를 거치면 로그인 안 된 사람은 nginx가 그룹웨어 로그인으로 먼저 보내서 여기 안 옴).
// api()는 401이면 이 페이지로 되돌아오게 돼 있어 무한 반복이 되므로 여기선 fetch를 직접 쓴다.
fetch(apiUrl("/auth/me"), { credentials: "include" })
  .then((res) => {
    if (res.ok) window.location.replace("dashboard.html");
    else document.body.style.visibility = "visible";
  })
  .catch(() => { document.body.style.visibility = "visible"; });

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("error");
  errorEl.style.display = "none";
  try {
    await apiPost("/auth/login", {
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
    });
    window.location.href = "dashboard.html";
  } catch (err) {
    showError(errorEl, err);
  }
});
</script>
</body>
</html>
