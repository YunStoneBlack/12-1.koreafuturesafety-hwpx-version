<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시특법 - 서류 자동화</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="css/mail.css" />
<link rel="stylesheet" href="css/contract-docs.css" />
<link rel="stylesheet" href="css/docs.css" />
<link rel="stylesheet" href="css/site-info.css" />
<link rel="stylesheet" href="css/sitok.css" />
<link rel="stylesheet" href="css/sitok-docs.css" />
</head>
<!-- 서류 자동화 · 시특법 — 계약 목록(2026-10-12, js/sitok-docs.js · API server/api/routers/sitok_docs.py). 산안법(docs.html)처럼 보고서 쪽과 따로, 현장(시설물) 연결.
     민간 = 우리가 계약서를 작성(회차 줄 · 정기/정밀 · 계약 해지 시까지), 관급 = 나라장터 계약서 → 착수계·완료계(2단계). 탭은 shell.js SITOK_DOCS_TABS. -->
<body data-docs-tab="contracts" data-law="sitok" data-sticky-list>
<div class="app">
  <aside class="sidebar" id="gw-sidebar"></aside>
  <main class="main">

<div id="error" class="error"></div>

<!-- 계약 시작 대시보드(10/16 민재형 "한눈에 딱 구분되게") — 민간: 계약서 불러오기(발주처 양식·발주서·날인본) · 새 계약서 만들기,
     관급: 나라장터 계약서 불러오기 · 내역서(착수계 붙임 산출내역서로 그대로). 시설물(동·건물) 관리는 보고서 자동화에서만. -->
<div class="sd-dash">
  <section class="sd-dash-p civil">
    <div class="sd-dash-h"><span class="sd-chip civil">민간</span><b>민간 계약</b><span class="mail-note">계약서를 받았으면 불러오고, 없으면 새로 만듭니다</span></div>
    <div class="sd-dash-acts">
      <label class="drop-box sd-drop" id="sd-drop-civil">
        <span class="drop-ico">📄</span>
        <span class="drop-txt"><b>계약서 불러오기</b>
          <span>발주처 양식·발주서·날인본<br><span class="drop-pc">끌어다 놓거나 눌러서 고르기</span><span class="drop-touch">눌러서 고르기</span></span></span>
        <input id="sd-existing" type="file" accept=".pdf,.hwp,.hwpx,.jpg,.jpeg,.png,application/pdf,image/*" hidden data-kr-file="skip" />
      </label>
      <button type="button" class="sd-dash-btn" id="sd-new-civil"><span class="drop-ico">📝</span>
        <span class="drop-txt"><b>새 계약서 만들기</b><span>시설물관리대장·사업자등록증을<br>올리면 칸이 채워짐</span></span></button>
    </div>
  </section>
  <section class="sd-dash-p gov">
    <div class="sd-dash-h"><span class="sd-chip gov">관급</span><b>관급 계약</b><span class="mail-note">나라장터 계약서 → 착수계·완료계</span></div>
    <div class="sd-dash-acts">
      <label class="drop-box sd-drop" id="sd-drop-gov">
        <span class="drop-ico">📄</span>
        <span class="drop-txt"><b>나라장터 계약서 불러오기</b>
          <span>읽어서 새 관급 계약으로<br><span class="drop-pc">끌어다 놓거나 눌러서 고르기</span><span class="drop-touch">눌러서 고르기</span></span></span>
        <input id="sd-g2b" type="file" accept=".pdf,.hwp,.hwpx,.jpg,.jpeg,.png,application/pdf,image/*" hidden data-kr-file="skip" />
      </label>
      <label class="drop-box sd-drop" id="sd-drop-est">
        <span class="drop-ico">📎</span>
        <span class="drop-txt"><b>내역서</b>
          <span id="sd-est-note">산출내역서·과업내용서<br>착수계 붙임에 자동으로 들어감</span></span>
        <input id="sd-est" type="file" accept=".pdf,.hwp,.hwpx,.xlsx,.xls,.jpg,.jpeg,.png,application/pdf,image/*" hidden data-kr-file="skip" />
      </label>
    </div>
  </section>
</div>
<div id="sd-new-msg" class="status"></div>

<div class="list-toolbar sd-find">
  <input id="sd-search" type="search" placeholder="번호(민간-3)·시설물·계약건명·관리주체·담당자로 검색" autocomplete="off" />
  <button type="button" class="sd-loose" id="sd-loose" hidden></button>
</div>
<!-- 10/15 민재형 문서번호 일치화: 뱃지(분야·관급 종류)별 개수 — 누르면 그것만 -->
<div class="sk-badges" id="sd-badges" role="group" aria-label="뱃지별 시설물 수"></div>

<section class="panel">
  <div class="panel-head"><h2 id="sd-list-title">시설물 카드</h2>
    <span class="site-sort sd-sector" role="group" aria-label="민간·관급"><button type="button" data-sector="">전체</button><button type="button" data-sector="민간">민간</button><button type="button" data-sector="관급">관급</button></span>
    <span class="site-sort sd-sort" role="group" aria-label="정렬"><button type="button" data-sort="viewed">최근 열람순</button><button type="button" data-sort="no">번호순</button></span>
    <span class="dc-count" id="sd-count"></span></div>
  <div class="rows" id="sd-list"><div class="empty-note">불러오는 중...</div></div>
</section>

<section class="panel sd-tpl">
  <div class="panel-head"><h2>민간 계약서 양식</h2></div>
  <div class="panel-body">
    <p class="mail-note">계약서 한 장 양식(정기·정밀 같이 씀). 한글에서 문구를 고쳐 다시 올리면 다음 계약서부터 그 양식으로 만듭니다.
      <b>{시설물명}·{계약금액}</b>처럼 중괄호 자리는 지우지 마세요 — 빠지면 안 받습니다.</p>
    <div class="sd-tpl-acts">
      <a class="secondary-link" id="sd-tpl-get" href="#">⬇ 지금 양식 받기</a>
      <label class="cd-upload">⬆ 고친 양식 올리기<input id="sd-tpl-file" type="file" accept=".hwp,.hwpx" hidden data-kr-file="skip" /></label>
      <span class="mail-note" id="sd-tpl-msg"></span>
    </div>
  </div>
</section>

  </main>
</div>

<script src="app.js"></script>
<script src="mail.js"></script>
<script src="shell.js"></script>
<script src="js/docs-common.js"></script>
<script src="js/sitok-docs-gov.js"></script>
<script src="js/sitok-docs.js"></script>
<script src="js/sticky-head.js"></script>
</body>
</html>
